name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time: a new push cancels the still-running run,
# so only the newest sha builds and reaches the server.
concurrency:
  group: prod-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          # Registry cache: no GHA-cache quota pressure (rust-cache lives
          # there), free on GHCR for a public repo. mode=max keeps the
          # cargo-chef intermediate stages, so dep compiles are reused.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Deploy to server
        # NOTE: the server locks this key to /opt/fetchly/deploy.sh via
        # authorized_keys `command=` (see docs/server-setup.md), so the
        # script below documents intent — the server always runs deploy.sh.
        # Keep both in sync.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/fetchly
            docker compose pull
            docker compose up -d
